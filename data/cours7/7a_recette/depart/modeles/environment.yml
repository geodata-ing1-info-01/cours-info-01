# L'environnement du programme de la recette, pour le projet 7.
#
#   conda env create -f environment.yml
#
# Python et pandoc, que le programme lance. Pillow (étape C3) et numpy
# (étape C4) s'ajoutent au fil du TD : `conda install -c conda-forge pillow`,
# puis une ligne ici, et de même pour numpy.
name: info01-recette

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pandoc
