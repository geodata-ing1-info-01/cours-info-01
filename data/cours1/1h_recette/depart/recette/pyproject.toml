# Ce que ce projet est, et ce dont il a besoin pour tourner.
#
# `pyproject.toml` est le fichier standard des projets Python. Il joue pour le
# projet le rôle qu'`environment.yml` joue pour l'environnement : décrire dans
# un fichier versionné ce qu'il faut avoir pour que le code fonctionne, plutôt
# que de compter sur la mémoire de celui qui l'a installé une fois.
#
# La ligne qui compte pour le TD est `dependencies`.

[project]
name = "recette"
version = "0.1.0"
description = "Met une recette Markdown à l'échelle et en fait une page HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown>=3.5", "tabulate>=0.9"]

# Ce que la commande `recette` doit appeler, une fois le projet installé.
# Sans installation, la même chose se lance par `python -m recette`.
[project.scripts]
recette = "recette.__main__:main"

# Quel outil sait fabriquer le paquet à partir de ce dossier. Aucun projet
# Python n'a à choisir autre chose tant qu'il n'a rien de particulier à
# compiler.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Le code est sous `src/`, les fichiers de travail à côté : c'est la
# disposition la plus répandue, et elle évite qu'un `import recette` lancé
# depuis le dossier du projet trouve le dossier plutôt que le paquet installé.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["recette"]
