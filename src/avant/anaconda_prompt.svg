<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13">
  <title>La fenêtre de l'invite de commandes d'Anaconda</title>
  <rect x="20" y="16" width="680" height="184" rx="6" fill="#1f1f1f" stroke="#555" stroke-width="1"/>
  <rect x="20" y="16" width="680" height="28" rx="6" fill="#e9e9e9"/>
  <rect x="20" y="32" width="680" height="12" fill="#e9e9e9"/>
  <text x="34" y="35" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">Anaconda Prompt</text>
  <text x="640" y="35" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222" text-anchor="middle">–</text>
  <text x="663" y="35" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#222" text-anchor="middle">▢</text>
  <text x="686" y="35" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222" text-anchor="middle">✕</text>
  <text x="36" y="68" fill="#e6e6e6" textLength="482.4" lengthAdjust="spacingAndGlyphs">(base) C:\Users\eleve&gt;python -c &quot;import sys; print(sys.executable)&quot;</text>
  <text x="36" y="116" fill="#e6e6e6" textLength="252.0" lengthAdjust="spacingAndGlyphs">C:\ProgramData\anaconda3\python.exe</text>
  <text x="36" y="164" fill="#e6e6e6" textLength="158.4" lengthAdjust="spacingAndGlyphs">(base) C:\Users\eleve&gt;</text>
  <rect x="196.4" y="153" width="8" height="14" fill="#e6e6e6"/>
  <line x1="36.0" y1="73" x2="79.2" y2="73" stroke="#e07b1a" stroke-width="2.5"/>
  <line x1="86.4" y1="73" x2="187.2" y2="73" stroke="#3b7dd8" stroke-width="2.5"/>
  <line x1="194.4" y1="73" x2="518.4" y2="73" stroke="#3a9a5b" stroke-width="2.5"/>
  <line x1="36" y1="121" x2="288.0" y2="121" stroke="#8a8a8a" stroke-width="2.5"/>
  <line x1="36" y1="169" x2="204.4" y2="169" stroke="#b04ac4" stroke-width="2.5"/>
  <circle cx="57.6" cy="87" r="8" fill="#e07b1a"/><text x="57.6" y="91" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="136.8" cy="87" r="8" fill="#3b7dd8"/><text x="136.8" y="91" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="356.4" cy="87" r="8" fill="#3a9a5b"/><text x="356.4" y="91" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <circle cx="302.0" cy="112" r="8" fill="#8a8a8a"/><text x="302.0" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <circle cx="220.4" cy="160" r="8" fill="#b04ac4"/><text x="220.4" y="164" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <rect x="20" y="212" width="680" height="132" rx="6" fill="#f4f4f4" stroke="#d0d0d0"/>
  <g font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">
    <circle cx="40" cy="234" r="8" fill="#e07b1a"/><text x="40" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="56" y="238">l'environnement actif, ici <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">base</tspan>, celui d'Anaconda</text>
    <circle cx="40" cy="256" r="8" fill="#3b7dd8"/><text x="40" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="56" y="260">le dossier courant, celui où les commandes agissent</text>
    <circle cx="40" cy="278" r="8" fill="#3a9a5b"/><text x="40" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="56" y="282">la commande tapée après <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">&gt;</tspan>, suivie de Entrée</text>
    <circle cx="40" cy="300" r="8" fill="#8a8a8a"/><text x="40" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="56" y="304">la réponse : ici le chemin du Python qui a exécuté la commande</text>
    <circle cx="40" cy="322" r="8" fill="#b04ac4"/><text x="40" y="326" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="56" y="326">l'invite revient : prête pour une autre commande</text>
  </g>
</svg>
