<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <title>Le menu Démarrer, après avoir tapé anaconda</title>
  <rect x="20" y="16" width="440" height="228" rx="8" fill="#f7f7f7" stroke="#c9c9c9"/>
  <rect x="36" y="32" width="408" height="36" rx="18" fill="#ffffff" stroke="#9a9a9a"/>
  <circle cx="56" cy="50" r="6" fill="none" stroke="#666" stroke-width="1.5"/><line x1="60.5" y1="54.5" x2="66" y2="60" stroke="#666" stroke-width="1.5"/>
  <text x="80" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#222">anaconda</text>
  <rect x="146" y="40" width="1.5" height="20" fill="#222"/>
  <text x="36" y="86" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#777">Meilleurs résultats</text>
  <rect x="36" y="96" width="408" height="40" rx="4" fill="#e8eef8"/><rect x="48" y="104" width="24" height="24" rx="4" fill="#3f8f3f"/><text x="84" y="114" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">Anaconda Navigator (anaconda3)</text><text x="84" y="129" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#777">Application</text><rect x="36" y="140" width="408" height="40" rx="4" fill="#ffffff"/><rect x="48" y="148" width="24" height="24" rx="4" fill="#3f8f3f"/><text x="84" y="158" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">Anaconda Prompt (anaconda3)</text><text x="84" y="173" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#777">Application</text><rect x="36" y="184" width="408" height="40" rx="4" fill="#ffffff"/><rect x="48" y="192" width="24" height="24" rx="4" fill="#3f8f3f"/><text x="84" y="202" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">Spyder (anaconda3)</text><text x="84" y="217" font-family="Liberation Sans, Arial, sans-serif" font-size="11" fill="#777">Application</text>
  <circle cx="478" cy="50" r="8" fill="#e07b1a"/><text x="478" y="54" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="494" y="50" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">taper <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">anaconda</tspan></text><text x="494" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">dans le menu Démarrer</text>
  <circle cx="478" cy="116" r="8" fill="#3b7dd8"/><text x="478" y="120" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="494" y="112" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">choisir l'application dans la liste :</text>
  <text x="494" y="130" font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">Navigator, Prompt ou Spyder</text>
  <text x="20" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666">Les intitulés exacts dépendent de la version de Windows ; « (anaconda3) » rappelle le dossier d'installation.</text>
</svg>
