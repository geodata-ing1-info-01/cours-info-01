<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <title>Comment le terminal trouve un programme</title>
  <rect x="20" y="16" width="680" height="60" rx="6" fill="#1f1f1f" stroke="#555"/>
  <text x="36" y="52" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13" fill="#e6e6e6">(base) C:\Users\eleve&gt;python</text>
  <circle cx="268" cy="48" r="8" fill="#e07b1a"/><text x="268" y="52" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="20" y="90" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666">où le terminal cherche, dans l'ordre :</text>
  <circle cx="246" cy="86" r="8" fill="#3b7dd8"/><text x="246" y="90" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <rect x="150" y="96" width="420" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="132" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">1.</text><text x="162" y="116" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\Users\eleve</text><text x="580" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666">le dossier courant</text><rect x="150" y="132" width="420" height="30" rx="4" fill="#e6f2ea" stroke="#3a9a5b" stroke-width="1.6"/><text x="132" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">2.</text><text x="162" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\ProgramData\anaconda3</text><text x="580" y="152" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#3a9a5b">python.exe</text><text x="660" y="153" font-family="Liberation Sans, Arial, sans-serif" font-size="14" fill="#3a9a5b">✔</text><rect x="150" y="168" width="420" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="132" y="188" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">3.</text><text x="162" y="188" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\ProgramData\anaconda3\Library\bin</text><rect x="150" y="204" width="420" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="132" y="224" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">4.</text><text x="162" y="224" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\ProgramData\anaconda3\Scripts</text><rect x="150" y="240" width="420" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="132" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">5.</text><text x="162" y="260" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\Windows\System32</text><rect x="150" y="276" width="420" height="30" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="132" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">6.</text><text x="162" y="296" font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12.5" fill="#222">C:\Users\eleve\AppData\Local\Microsoft\WindowsApps</text>
  <rect x="20" y="322" width="680" height="66" rx="6" fill="#f4f4f4" stroke="#d0d0d0"/>
  <g font-family="Liberation Sans, Arial, sans-serif" font-size="13" fill="#222">
    <circle cx="40" cy="342" r="8" fill="#e07b1a"/><text x="40" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="56" y="346">le nom tapé : le terminal cherche un fichier <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">python.exe</tspan> (ou <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">.bat</tspan>, <tspan font-family="Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace">.cmd</tspan>)</text>
    <circle cx="40" cy="364" r="8" fill="#3b7dd8"/><text x="40" y="368" font-family="Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="56" y="368">dans le dossier courant, puis dans chaque dossier de PATH, dans l'ordre ; le premier trouvé est lancé</text>
  </g>
</svg>
